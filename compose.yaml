# TaskWeaver full-stack compose (controller + worker + local LLM).
#
# Network topology per WORKER.md §8:
#
#   taskweaver-private (internal, trusted): worker + controller + llm
#   default/public:                           controller only (admin UI,
#                                             MCP servers, keyed LLMs)
#
# The worker is attached ONLY to taskweaver-private, which is internal —
# no route to the internet, enforced at the network layer. Even a fully
# compromised worker container has no secrets and no egress; the
# blast-radius boundary is the network.
#
# Usage:
#   cp .env.example .env      # compose reads .env from this directory
#   edit .env                 # set APP_SECRET + TASKWEAVER_ENROLLMENT_TOKEN
#   docker compose build
#   docker compose up -d
#   → admin UI: http://localhost:8080
#
# The compose file is environment-agnostic: every value comes from the
# environment (a .env file next to it, or real env vars in prod). Core
# secrets use the ":?" form — compose REFUSES to start if they are missing.
#
# The worker provisions itself on boot using TASKWEAVER_ENROLLMENT_TOKEN
# (must match the controller's env value).

networks:
  # Internal: no outbound route for anything attached to it. The controller
  # bridges it to the outside world (worker API + proxied LLM channel).
  taskweaver-private:
    internal: true

services:
  controller:
    image: digitaladapt/task-weaver:latest
    environment:
      APP_ENV: ${APP_ENV:-prod}
      # Core secrets — required, no defaults. Generate with:
      #   php -r "echo bin2hex(random_bytes(32));"
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required — copy .env.example to .env and set it}
      TASKWEAVER_ENROLLMENT_TOKEN: ${TASKWEAVER_ENROLLMENT_TOKEN:?TASKWEAVER_ENROLLMENT_TOKEN is required — copy .env.example to .env and set it}
      TASKWEAVER_LLM_URL: ${TASKWEAVER_LLM_URL:-http://llm:8080/v1}
      TASKWEAVER_LLM_MODEL: ${TASKWEAVER_LLM_MODEL:-Qwen3.5-4B}
      TASKWEAVER_TIMEZONE: ${TASKWEAVER_TIMEZONE:-}
      # Set TASKWEAVER_LLM_API_KEY to switch workers to the proxied channel
      # (workers then send LLM traffic via the controller's /api/worker/llm).
      TASKWEAVER_LLM_API_KEY: ${TASKWEAVER_LLM_API_KEY:-}
      # DB + messenger live on a named volume inside the container; the
      # values match .env.example. In prod there is no dotenv file (the
      # base .env.dist only sets APP_ENV=dev) so they must be injected here.
      DATABASE_URL: ${DATABASE_URL:-sqlite:///%kernel.project_dir%/var/data/taskweaver.db}
    volumes:
      - controller-data:/app/var
    ports:
      # Bind localhost-only by default so a freshly-upped host doesn't expose
      # the admin UI to the LAN. Publish/forward as your front proxy requires.
      - "127.0.0.1:8080:80"
    networks:
      - default          # public side: admin UI + outbound MCP/LLM calls
      - taskweaver-private
    restart: unless-stopped

  worker:
    image: digitaladapt/task-weaver:latest-worker
    depends_on:
      controller:
        condition: service_healthy
      llm:
        condition: service_healthy
    environment:
      TASKWEAVER_CONTROLLER_URL: http://controller:80
      TASKWEAVER_ENROLLMENT_TOKEN: ${TASKWEAVER_ENROLLMENT_TOKEN:?TASKWEAVER_ENROLLMENT_TOKEN is required — copy .env.example to .env and set it}
      WORKER_NAME: ${WORKER_NAME:-worker-1}
      # Descriptor identity reported at provision time. Known images get
      # server-mapped tags; unknown images are "light workers" that must
      # declare their capabilities to be trusted with anything.
      TASKWEAVER_WORKER_IMAGE: ${TASKWEAVER_WORKER_IMAGE:-digitaladapt/task-weaver:latest-worker}
      WORKER_CAPABILITIES: ${WORKER_CAPABILITIES:-}
    # --- WORKER.md §2 hardening ---
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /work/tmp
    volumes:
      - worker-workspace:/work/workspace
    mem_limit: 1g
    cpus: "1.0"
    # The worker's ONLY network is the internal private one: no internet,
    # ever. Its one trusted channel is the controller (+ the local LLM).
    networks:
      - taskweaver-private
    restart: unless-stopped

  # Local LLM (Ollama). Optional — comment out if you use a keyed provider
  # (then set TASKWEAVER_LLM_API_KEY on the controller instead).
  llm:
    command:
      - --models-preset
      - /config/models.ini
      - --port
      - "8080"
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models.ini:/config/models.ini
      - llm-models:/models
    networks:
      - taskweaver-private
    restart: unless-stopped

  # Long-running scheduler driver: ticks the scheduler every minute so
  # recurring tasks fire without any host cron. Opt-in via compose profiles
  # (docker compose --profile scheduler up -d); without the profile the
  # deployment relies on an external cron / systemd timer calling
  # app:scheduler:tick instead. It shares the controller image and runs the
  # same migrations in the entrypoint, so it cannot drift from the web app.
  scheduler:
    image: digitaladapt/task-weaver:latest-scheduler
    depends_on:
      controller:
        condition: service_healthy
    environment:
      # Same prod boot-guard applies: the kernel refuses to start without a
      # real APP_SECRET (see Kernel::boot) — never hard-code a placeholder.
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required — copy .env.example to .env and set it}
      # Scheduler never talks to workers directly, but the value must match
      # the controller's so enrolment stays consistent across the deployment.
      TASKWEAVER_ENROLLMENT_TOKEN: ${TASKWEAVER_ENROLLMENT_TOKEN:?TASKWEAVER_ENROLLMENT_TOKEN is required — copy .env.example to .env and set it}
      TASKWEAVER_TIMEZONE: ${TASKWEAVER_TIMEZONE:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///%kernel.project_dir%/var/data/taskweaver.db}
    volumes:
      - controller-data:/app/var:ro
    networks:
      - taskweaver-private
    restart: unless-stopped

volumes:
  controller-data:
  worker-workspace:
  llm-config:
  llm-models:
