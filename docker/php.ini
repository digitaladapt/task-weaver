; Production php.ini for FrankenPHP worker mode.
; The kernel is loaded once and kept in memory — OPcache carries it.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

realpath_cache_size=4096K
realpath_cache_ttl=600

; Production error reporting — never leak to responses, always to stderr.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

; Session hardening (admin UI login).
session.cookie_httponly=1
session.use_strict_mode=1
session.cache_limiter=none

; No PHP version disclosure.
expose_php=Off
