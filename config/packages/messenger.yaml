framework:
    messenger:
        # Failed messages are kept for later inspection via
        # `bin/console messenger:failed:show`.
        failure_transport: failed

        transports:
            # Task-due notifications run synchronously — the handler is a
            # log line, no need for a worker. If something genuinely async
            # lands (email, webhooks), re-add the Doctrine transport then.
            # `sync` must be declared explicitly (it is not implicit).
            sync: 'sync://'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            'App\Message\TaskDueMessage': sync
