security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        api_key_user_provider:
            id: App\Security\ApiKeyUserProvider

    firewalls:
        # Dev tooling / static assets always pass.
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Worker machine-to-machine API — its own auth (enrollment token +
        # ephemeral worker Bearer keys); never admin session auth.
        worker_api:
            pattern: ^/api/worker
            stateless: true
            security: false

        # Everything else: the admin UI (server-rendered pages, form POSTs)
        # and the auth endpoints. Session-based: the browser's stored API
        # key is presented as X-API-Key on the bootstrap/verify call, the
        # authenticator validates it and establishes the session cookie.
        main:
            lazy: true
            provider: api_key_user_provider
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        # First match wins.
        - { path: ^/api/worker, roles: PUBLIC_ACCESS }
        - { path: ^/setup, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/setup, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/status, roles: PUBLIC_ACCESS }
        # /api/auth/verify requires a valid key (header) — authenticating
        # through it is what establishes the session cookie.
        - { path: ^/api/auth/verify, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10