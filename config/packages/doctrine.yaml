doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # SQLite in v1 — the only supported database (SPEC.md → Development Notes).
        # No server_version needed for SQLite.
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        # JSON columns are emulated via the DBAL JSON type (SQLite handles text).
        # Tag matching (claim, tool authorization) is done in PHP service layer
        # for v1 — keeps SQLite queries simple and avoids extra dependencies.
