# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:
    # TaskWeaver tunables — all from environment variables (SPEC.md → Configuration).
    # symfony/dotenv is dev-only; production injects real env vars.
    env(TASKWEAVER_MAX_ROUNDS): '50'
    env(TASKWEAVER_STEP_TIMEOUT): '600'
    # Two-clock step liveness (docs/step-liveness-plan.md §3.8):
    #   IDLE_TIMEOUT — max seconds of silence between activity before the
    #                  step's rolling deadline trips.
    #   GRACE        — head start the worker takes: it aborts at
    #                  deadline − grace so it can still transmit partial
    #                  results instead of being cut off by the controller.
    env(TASKWEAVER_STEP_IDLE_TIMEOUT): '120'
    env(TASKWEAVER_STEP_GRACE): '15'
    env(TASKWEAVER_CONTEXT_REQUEST_SIZE): '6000'
    env(TASKWEAVER_CONTEXT_OUTPUT_BUFFER): '1500'
    env(TASKWEAVER_LLM_MAX_CONCURRENCY): '1'
    # No default for the enrollment token: dev/test get theirs from the
    # committed .env.dev / .env.test; production must inject a real one.
    # An unset token fails loudly at boot (Kernel guard) instead of
    # silently accepting a well-known dev value.
    env(TASKWEAVER_LLM_URL): 'http://llm:8080/v1'
    env(TASKWEAVER_LLM_MODEL): 'Qwen3.5-4B'
    # Provider key for an external/keyed LLM. Empty → direct local LLM
    # channel (workers talk to TASKWEAVER_LLM_URL themselves). Set → the
    # controller proxies all worker LLM traffic via /api/worker/llm.
    env(TASKWEAVER_LLM_API_KEY): ''
    env(TASKWEAVER_SYSTEM_PROMPT_OVERRIDE): null
    # Deployment-wide scheduling timezone; empty falls back to the system default.
    env(TASKWEAVER_TIMEZONE): ''

    # Chat reply context window (per-turn history budget).
    env(TASKWEAVER_HISTORY_MESSAGES): '20'
    env(TASKWEAVER_HISTORY_CHARS): '8000'
    # Auto-compaction: a conversation compacts its transcript into a rolling
    # summary once the history newer than the summary's high-water mark has
    # more than this many completed turns, or more than this many chars
    # (whichever trips first; both env-tunable).
    env(TASKWEAVER_COMPACTION_MESSAGE_THRESHOLD): '15'
    env(TASKWEAVER_COMPACTION_CHAR_THRESHOLD): '6000'

    # The deployment-wide default model (TASKWEAVER_LLM_MODEL): issued to
    # workers at provision time and used to resolve step.model = NULL.
    llm_model: '%env(TASKWEAVER_LLM_MODEL)%'

    # Model discovery: the controller proxies GET {llm_url}/models for the
    # admin UI datalists and the worker discovery route. Normalized result
    # cached in-process for this many seconds (0 = always fetch).
    env(TASKWEAVER_LLM_MODELS_CACHE_TTL): '300'

    # LLM proxy (keyed/external providers). The controller holds the key;
    # workers authenticate with their Tier-1 key. Only active when the key
    # is set. The upstream URL defaults to TASKWEAVER_LLM_URL + /chat/completions.
    env(TASKWEAVER_LLM_PROXY_UPSTREAM_URL): ''
    llm_api_key: '%env(TASKWEAVER_LLM_API_KEY)%'
    llm_proxy_upstream_url: '%env(default::TASKWEAVER_LLM_URL)%/chat/completions'
    llm_proxy_output_buffer: '%env(int:TASKWEAVER_CONTEXT_OUTPUT_BUFFER)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # MCP clients are tagged so the registry receives them all.
    App\MCP\HttpMcpClient:
        tags: ['app.mcp_client']
    App\MCP\OpenApiMcpClient:
        tags: ['app.mcp_client']

    App\MCP\McpClientRegistry:
        arguments:
            $clients: !tagged_iterator app.mcp_client

    # Model discovery: scalar config from env (autowiring can't provide it).
    App\Service\ModelCatalogService:
        arguments:
            $llmUrl: '%env(TASKWEAVER_LLM_URL)%'
            $defaultModel: '%env(TASKWEAVER_LLM_MODEL)%'
            $cacheTtl: '%env(int:TASKWEAVER_LLM_MODELS_CACHE_TTL)%'

    # Claim responses resolve step.model to override-or-default (M4).
    App\Controller\ClaimController:
        arguments:
            $defaultModel: '%env(TASKWEAVER_LLM_MODEL)%'

    # Conversations: reply-context budget + auto-compaction thresholds.
    App\Service\ConversationService:
        arguments:
            $historyMessages: '%env(int:TASKWEAVER_HISTORY_MESSAGES)%'
            $historyChars: '%env(int:TASKWEAVER_HISTORY_CHARS)%'
            $compactionMessageThreshold: '%env(int:TASKWEAVER_COMPACTION_MESSAGE_THRESHOLD)%'
            $compactionCharThreshold: '%env(int:TASKWEAVER_COMPACTION_CHAR_THRESHOLD)%'

    # Controller-issued worker config values.
    App\Service\ProvisionService:
        arguments:
            $enrollmentToken: '%env(TASKWEAVER_ENROLLMENT_TOKEN)%'
            $maxRounds: '%env(int:TASKWEAVER_MAX_ROUNDS)%'
            $stepTimeout: '%env(int:TASKWEAVER_STEP_TIMEOUT)%'
            $stepIdleTimeout: '%env(int:TASKWEAVER_STEP_IDLE_TIMEOUT)%'
            $stepGrace: '%env(int:TASKWEAVER_STEP_GRACE)%'
            $contextRequestSize: '%env(int:TASKWEAVER_CONTEXT_REQUEST_SIZE)%'
            $contextOutputBuffer: '%env(int:TASKWEAVER_CONTEXT_OUTPUT_BUFFER)%'
            $llmMaxConcurrency: '%env(int:TASKWEAVER_LLM_MAX_CONCURRENCY)%'
            $llmUrl: '%env(TASKWEAVER_LLM_URL)%'
            $llmModel: '%env(TASKWEAVER_LLM_MODEL)%'
            $systemPromptOverride: '%env(TASKWEAVER_SYSTEM_PROMPT_OVERRIDE)%'
            # Presence of a provider key decides the LLM channel (proxy vs
            # direct). NOTE: `env(bool:...)` would cast the key string via
            # filter_var(FILTER_VALIDATE_BOOL) — a real key like
            # "sk-proj-..." is NOT a valid boolean token, so it always
            # evaluated to FALSE and workers were never told to proxy.
            # We pass the raw key string; ProvisionService decides.
            $llmApiKey: '%llm_api_key%'

    # Step liveness for the workflow service (both clocks + worker grace).
    App\Service\TaskWorkflowService:
        arguments:
            $stepTimeout: '%env(int:TASKWEAVER_STEP_TIMEOUT)%'
            $idleTimeout: '%env(int:TASKWEAVER_STEP_IDLE_TIMEOUT)%'
            $grace: '%env(int:TASKWEAVER_STEP_GRACE)%'

    # Deployment-wide timezone (empty → system default).
    App\Service\TimezoneService:
        arguments:
            $timezone: '%env(TASKWEAVER_TIMEZONE)%'

    # SeedCommand needs the kernel environment for its prod no-op guard.
    App\Command\SeedCommand:
        arguments:
            $environment: '%kernel.environment%'

    # API-key check belongs to the security firewall dispatcher, not the
    # global one — that's what lets failed logins flow through the
    # LoginThrottlingListener (max 5/min) instead of bypassing it.
    App\Security\ApiKeyCheckListener:
        autoconfigure: false
        arguments:
            $apiKeyRepository: '@App\Repository\ApiKeyRepository'
            $requestStack: '@request_stack'
        tags:
            - { name: kernel.event_listener, event: Symfony\Component\Security\Http\Event\CheckPassportEvent, dispatcher: security.event_dispatcher.main, priority: 0 }
